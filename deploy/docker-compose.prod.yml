version: '3.8'

services:
  admin-panel:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/admin-panel}:latest
    container_name: admin-panel
    ports:
      - "80:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - web

networks:
  web:
    driver: bridge
